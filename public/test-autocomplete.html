<!DOCTYPE html>
<html>
<head>
  <title>Google Places Autocomplete Test</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    .input-container {
      margin: 20px 0;
      position: relative;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: white;
      border: 1px solid #ccc;
      border-top: none;
      border-radius: 0 0 4px 4px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      z-index: 1000;
    }
    .suggestion-item {
      padding: 10px;
      cursor: pointer;
    }
    .suggestion-item:hover {
      background: #f0f0f0;
    }
    .error {
      color: red;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid red;
      border-radius: 4px;
    }
    .success {
      color: green;
      padding: 10px;
      margin: 10px 0;
      border: 1px solid green;
      border-radius: 4px;
    }
    .debug {
      background: #f5f5f5;
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      white-space: pre-wrap;
    }
    #selectedPlace {
      margin-top: 20px;
      padding: 10px;
      background: #f0f0f0;
      border-radius: 4px;
    }
    .api-key {
      word-break: break-all;
      font-family: monospace;
    }
    .loading {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Google Places API Test (New Version)</h1>
    <div id="status"></div>
    
    <div class="debug">
      <h3>API Key Information:</h3>
      <p class="api-key">Full API Key: <span id="fullApiKey"></span></p>
      <p>This test page uses the new Places API endpoint:</p>
      <code>https://places.googleapis.com/v1/places:autocomplete</code>
    </div>

    <div class="input-container">
      <label for="searchInput">Search for any city in the world:</label>
      <input 
        id="searchInput" 
        type="text" 
        placeholder="Type any city name (e.g., New York, London, Tokyo)"
        autocomplete="off"
      >
      <div class="loading">Loading...</div>
      <div id="suggestions" class="suggestions"></div>
    </div>

    <div id="selectedPlace"></div>
    <div id="debugInfo" class="debug" style="margin-top: 20px;">
      <h3>Debug Information:</h3>
      <pre id="debugLog"></pre>
    </div>
  </div>

  <script>
    // Get the API key from the URL parameter or use the default one
    const urlParams = new URLSearchParams(window.location.search);
    const apiKey = urlParams.get('key') || 'AIzaSyBxf4gqvl9YMTCU5YyvNkPq5qiLut1g7Yw';
    
    const statusDiv = document.getElementById('status');
    const selectedPlaceDiv = document.getElementById('selectedPlace');
    const fullApiKeySpan = document.getElementById('fullApiKey');
    const debugLog = document.getElementById('debugLog');
    const searchInput = document.getElementById('searchInput');
    const suggestionsDiv = document.getElementById('suggestions');
    const loadingDiv = document.querySelector('.loading');
    
    // Debug logging function
    function log(message) {
      const timestamp = new Date().toLocaleTimeString();
      const logMessage = `[${timestamp}] ${message}\n`;
      debugLog.textContent = logMessage + debugLog.textContent;
      console.log(message);
    }
    
    // Display the full API key for debugging
    fullApiKeySpan.textContent = apiKey;
    
    statusDiv.innerHTML = `
      <div class="debug">Testing with API key: ${apiKey}</div>
    `;

    // Debounce function to limit API calls
    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // Function to search places using the new Places API Autocomplete endpoint
    async function searchPlaces(query) {
      if (!query || query.length < 2) {
        suggestionsDiv.style.display = 'none';
        return;
      }

      loadingDiv.style.display = 'block';
      log(`Searching for: "${query}"`);

      try {
        const response = await fetch('https://places.googleapis.com/v1/places:autocomplete', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Goog-Api-Key': apiKey,
            'X-Goog-FieldMask': 'suggestions.placePrediction.place,suggestions.placePrediction.text,suggestions.placePrediction.structuredFormat,suggestions.placePrediction.types'
          },
          body: JSON.stringify({
            input: query,
            includedPrimaryTypes: ['(cities)'],  // Only return cities
            languageCode: 'en'  // Use English for global results
          })
        });

        const data = await response.json();
        log(`API Response: ${JSON.stringify(data, null, 2)}`);

        if (data.suggestions) {
          suggestionsDiv.innerHTML = data.suggestions.map(suggestion => {
            const place = suggestion.placePrediction;
            const mainText = place.structuredFormat?.mainText?.text || place.text.text;
            const secondaryText = place.structuredFormat?.secondaryText?.text || '';
            
            return `
              <div class="suggestion-item" data-place-id="${place.place}">
                <strong>${mainText}</strong><br>
                <small>${secondaryText}</small>
              </div>
            `;
          }).join('');
          suggestionsDiv.style.display = 'block';
        } else {
          suggestionsDiv.innerHTML = '<div class="suggestion-item">No results found</div>';
          suggestionsDiv.style.display = 'block';
        }
      } catch (error) {
        log(`Error: ${error.message}`);
        suggestionsDiv.innerHTML = `<div class="suggestion-item error">Error: ${error.message}</div>`;
        suggestionsDiv.style.display = 'block';
      } finally {
        loadingDiv.style.display = 'none';
      }
    }

    // Function to get place details
    async function getPlaceDetails(placeId) {
      try {
        // Extract the actual place ID from the full place path
        const actualPlaceId = placeId.split('/').pop();
        
        const response = await fetch(`https://places.googleapis.com/v1/places/${actualPlaceId}`, {
          headers: {
            'X-Goog-Api-Key': apiKey,
            'X-Goog-FieldMask': 'displayName,formattedAddress,location'
          }
        });

        const place = await response.json();
        log(`Place Details: ${JSON.stringify(place, null, 2)}`);

        selectedPlaceDiv.innerHTML = `
          <h3>Selected Place Details:</h3>
          <div class="debug">
Name: ${place.displayName.text}
Address: ${place.formattedAddress}
Latitude: ${place.location.latitude}
Longitude: ${place.location.longitude}
          </div>
        `;
      } catch (error) {
        log(`Error getting place details: ${error.message}`);
        selectedPlaceDiv.innerHTML = `<div class="error">Error getting place details: ${error.message}</div>`;
      }
    }

    // Set up event listeners
    const debouncedSearch = debounce(searchPlaces, 300);

    searchInput.addEventListener('input', (e) => {
      const query = e.target.value.trim();
      log(`Input changed: "${query}"`);
      debouncedSearch(query);
    });

    searchInput.addEventListener('focus', () => {
      log('Input focused');
      if (suggestionsDiv.innerHTML) {
        suggestionsDiv.style.display = 'block';
      }
    });

    document.addEventListener('click', (e) => {
      if (!suggestionsDiv.contains(e.target) && e.target !== searchInput) {
        suggestionsDiv.style.display = 'none';
      }
    });

    suggestionsDiv.addEventListener('click', (e) => {
      const item = e.target.closest('.suggestion-item');
      if (item) {
        const placeId = item.dataset.placeId;
        const placeName = item.querySelector('strong').textContent;
        searchInput.value = placeName;
        suggestionsDiv.style.display = 'none';
        log(`Selected place: ${placeName} (${placeId})`);
        getPlaceDetails(placeId);
      }
    });

    // Initial status
    log('Page loaded and ready');
  </script>
</body>
</html>
